<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Meta tags cơ bản -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cửa hàng mỹ phẩm chính hãng - Làm đẹp tự nhiên với các sản phẩm chất lượng cao">
    <meta name="keywords" content="mỹ phẩm, skincare, serum, kem dưỡng, chống nắng">
    
    <!-- Title -->
    <title>Cosmetics Store</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header với Navigation -->
    <header>
        <nav class="navbar">
            <div class="container">
                <!-- Logo / Tên cửa hàng -->
                <div class="logo">
                    <a href="#/">
                        <img src="assets/logo/logo.png" alt="Cosmetics Store" class="logo-img">
                    </a>
                </div>
                
                <!-- Navigation Links -->
                <ul class="nav-links">
                    <li><a href="#/">Trang chủ</a></li>
                    <li><a href="#/products">Sản phẩm</a></li>
                    <li>
                        <a href="#/cart" class="cart-link">
                            <span class="cart-icon">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M6 6H4.5C3.67 6 3 6.67 3 7.5V8.5L5 18.5C5.14 19.36 5.89 20 6.77 20H17.23C18.11 20 18.86 19.36 19 18.5L21 8.5V7.5C21 6.67 20.33 6 19.5 6H18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                                    <path d="M9 6V5C9 3.34 10.34 2 12 2C13.66 2 15 3.34 15 5V6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                                    <path d="M6 6H18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="cart-count" id="cartCount">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main Content Area - Nơi JavaScript sẽ render nội dung động -->
    <main id="app">
        <!-- Nội dung sẽ được render động bởi JavaScript -->
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <!-- Thông tin sinh viên -->
                <div class="footer-student">
                    <h4>Thông Tin Sinh Viên</h4>
                    <p><strong>Họ và tên:</strong> Lê Đăng Huy</p>
                    <p><strong>MSSV:</strong> 110123013</p>
                </div>
                
                <!-- Đường ngăn cách -->
                <div class="footer-divider"></div>
                
                <!-- Thông tin website -->
                <div class="footer-website">
                    <h4>Cosmetics Store</h4>
                    <p>Mỹ phẩm chính hãng - Làm đẹp tự nhiên</p>
                    <p>Email: <a href="mailto:contact@cosmeticsstore.com">contact@cosmeticsstore.com</a></p>
                    <p>Hotline: 1900-xxxx</p>
                    <p class="copyright">&copy; 2025 Cosmetics Store. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- JavaScript Module -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
